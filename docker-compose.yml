services:
  # ───────────────────────────────────────────
  #  PostgreSQL 15 — Auth, users & audit logs
  # ───────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: warehouse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     warehouse_admin
      POSTGRES_PASSWORD: change_me_in_production
      POSTGRES_DB:       warehouse_db
    volumes:
      # Persistent data volume
      - postgres_data:/var/lib/postgresql/data
      # Auto-run migration script on first startup
      - ./backend/migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_admin -d warehouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ───────────────────────────────────────────
  #  Backend — Express + Socket.io + MQTT
  # ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warehouse-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override hostnames for Docker network
      PG_HOST:     db
      CORS_ORIGIN: "*"
    volumes:
      # Mount Firebase service account key (not committed to Git)
      - ./backend/config/serviceAccountKey.json:/app/config/serviceAccountKey.json:ro
    ports:
      - "4000:4000"

  # ───────────────────────────────────────────
  #  Frontend — Nginx serving React SPA
  # ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warehouse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

# ─────────────────────────────────────────────
#  Named Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
